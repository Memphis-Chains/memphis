name: automerge

# Merge without a human, for PRs that have proven themselves.
#
# WHAT THIS REPLACES
# ------------------
# The previous version ran on any non-draft PR carrying an `automerge` label and
# called peter-evans/enable-pull-request-automerge. Measured 2026-10-10: the
# label `automerge` does not exist in this repository, no PR has ever carried it,
# and PRs #656 and #657 — merged without it — took 29 and 11 minutes from open
# to merge. So this workflow had never fired. A gate nobody triggers is a
# comment, not a gate, and it read as protection.
#
# It also would not have worked as written: it enabled auto-merge without
# referencing check status. GitHub's auto-merge does respect required status
# checks, so the ruleset was doing the real work, but nothing here said so.
#
# THE RULE NOW
# ------------
# Merge automatically when all four required checks are green AND the PR is not
# a draft. Nothing else: no label to forget, no config that silently stops
# matching. The check names are read from the repository ruleset rather than
# hardcoded, because a hardcoded list is a second place that can go stale — the
# same mistake as a metric nobody regenerates.
#
# Required checks come from the `main` ruleset. If that ruleset cannot be read,
# this workflow refuses rather than merging on assumption.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Required checks are read from the ruleset, not from a list in this file.
      # `refs/heads/main` is resolved by GitHub, so a branch rename does not
      # silently reduce the list to nothing.
      - name: Read required checks from the repository ruleset
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The LIST endpoint (/rulesets) returns ruleset metadata only — it has no
          # `rules` key at all. Reading `.rules[]?` from it yields nothing, and the
          # `?` turns that into an empty string rather than an error, so this step
          # failed with "no active required checks" while four required checks were
          # configured. Measured 2026-10-10 against this repo.
          #
          # Rules for a branch live at /rules/branches/<branch>, which returns the
          # effective rules including anything inherited from an org.
          branch="${MEMPHIS_MAIN_BRANCH:-main}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/${branch}"
          rules="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" "$api")"

          contexts="$(jq -r '
            [ .[] | select(.type == "required_status_checks")
              | .parameters.required_status_checks[]?.context ]
            | sort | unique | join(",")' <<<"$rules")"

          if [[ -z "$contexts" ]]; then
            echo "::error::No required status checks configured for '${branch}' — refusing to auto-merge."
            exit 1
          fi
          echo "required=$contexts" >>"$GITHUB_OUTPUT"

      - name: Merge when every required check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED: ${{ steps.policy.outputs.required }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          IFS=',' read -ra contexts <<<"$REQUIRED"

          for ctx in "${contexts[@]}"; do
            # A required check with no conclusion is not a pass. "pending" and
            # "skipped" both mean the branch has not earned a merge yet.
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"${ctx}\") | .conclusion][0] // \"missing\"" 2>/dev/null || echo missing)"
            if [[ "$conclusion" != "success" ]]; then
              echo "::notice::Not merging: required check '${ctx}' is '${conclusion}'."
              exit 0
            fi
          done

          echo "All ${#contexts[@]} required checks are green — merging."
          gh pr merge "${PR_NUMBER}" --squash \
            --repo "${GITHUB_REPOSITORY}"