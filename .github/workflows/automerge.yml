name: automerge

# Merge without a human, for PRs that have proven themselves.
#
# Two triggers, because one is not enough:
#
#   pull_request_target  fires as soon as the PR is opened or updated. At that
#                        moment the checks have not finished, so the job reads
#                        "missing" and correctly refuses. It costs one run.
#   workflow_run         fires when the required workflows finish. This is the
#                        run that can actually merge.
#
# Before 2026-10-10 only the first existed, so automerge never merged: it
# evaluated the checks once, while they were still running, and nothing woke
# it up afterwards. Observed on PR #663 — the step saw `chain-invariant` as
# `missing`, the check then went green, and the PR sat open until merged by
# hand.
#
# `check_run` / `check_suite` cannot be used instead: GitHub does not emit
# those events for check suites it created itself, which is every check here.
# `workflow_run` has no such restriction.
#
# SECURITY. This job holds a write token, so it must never execute code from a
# pull request. Both triggers run the workflow from `main`, and there is no
# `actions/checkout` anywhere in this file — every byte executed comes from the
# base branch. If a checkout is ever added here, the `pull_request_target`
# trigger becomes an arbitrary-code-execution hole: anyone able to open a pull
# request would inherit write access to the repository.
on:
  # `workflow_dispatch` is present because every scheduled workflow here that
  # has ever fired also carries it: rust-sanitizers, chain-invariant,
  # nightly-crystal, quarterly-gate, weekly-runtime-kpi, Telegram smoke test.
  # `automerge` was the only one without it, and its schedule never fired in
  # any shape tried — a 12-value minute list or a single minute. That is
  # correlation, not proof, but it is the only structural difference left
  # and a manual trigger costs nothing.
  workflow_dispatch:
  # ONE trigger, and it is the one GitHub actually emits for this repository.
  #
  # Measured on 2026-10-10, on PR #669, with the checks running green the
  # whole time:
  #
  #   workflow_run  fired 4x, every time with head_branch=main and head_sha
  #                 pointing at the MERGE rather than the PR head. Asking
  #                 "which PRs contain this commit" then correctly answered
  #                 none, so the job stopped every time with "nothing to merge"
  #                 while a mergeable PR sat open.
  #   check_run    fired 0 times. GitHub does not emit it for check suites it
  #                 created itself, which is every check in this repository.
  #
  # So the second door does not exist as a separate event. What remains is the
  # first door plus a delayed retry: `pull_request_target` on a schedule, which
  # re-reads the required checks and merges when they have gone green.
  #
  # This does NOT auto-merge on the fast path — a PR opened and pushed in one
  # go still waits for the retry, which is at most ~5 minutes. That is slower
  # than ideal and completely silent about it, which is the honest shape of a
  # repository whose own CI cannot report its own completion events.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    # Every 5 minutes. The first entry is off-peak so the repository is not hit
    # on the hour by every workflow at once.
    - cron: '7 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Two ways in.
    #
    #   pull_request_target  a verdict the moment the PR opens or is updated.
    #                        The checks are still running then, so this normally
    #                        reports `missing` and refuses. Cheap, and it refuses
    #                        loudly rather than by accident.
    #   schedule             every five minutes, asks which open pull request is
    #                        the newest non-draft one and whether its checks are
    #                        green. This is the run that can actually merge.
    #
    # `schedule` exists because both event-driven alternatives were measured and
    # neither works on this repository:
    #
    #   check_run    never fires. Zero such runs in the repository's history.
    #                GitHub does not emit it for check suites it created itself,
    #                which every check here is. (PR #670 switched to it.)
    #   workflow_run fires, but its payload carries the commit on `main` — the
    #                merge, not the pull request head. "Which open pull requests
    #                contain this commit" therefore answers correctly and
    #                uselessly: no open PR contains a merge commit. It ran four
    #                times on PR #669 and stopped with "nothing to merge" each
    #                time while a green, mergeable PR sat open.
    #
    # A schedule has no payload to be wrong about, so the job asks for the PR it
    # should act on instead of inferring it.
    #
    # The `if` is a conjunction because GitHub's expression parser rejects the
    # ternary form in a job-level `if`. Adding that ternary to the previous
    # `main` reproduced a silent failure: the workflow stopped being registered,
    # every trigger went quiet, and each push produced a run named after the
    # FILE PATH with conclusion `failure` and no jobs — "This run likely failed
    # because of a workflow file issue", with no detail. Bisection, 2026-10-10.
    #
    # `schedule` is listed first so the job runs at all when there is no pull
    # request object: on a schedule `github.event.pull_request` is null, and
    # dereferencing it in an `if` is an error rather than a false.
    if: >-
      github.event_name == 'schedule' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # `workflow_run` payloads carry no `pull_request` object, so the PR has to
      # be resolved from the commit the finished run was made against. When
      # several PRs share a head commit (a branch opened twice) the oldest is
      # taken: merging the newer one would merge the same commits twice.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # Passed through env, not interpolated into the script body. `${{ }}`
          # inside a run block is expanded by GitHub before bash sees it, which
          # works in production and makes the step untestable locally — the
          # extracted script then fails on a bad substitution.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            # No event payload on a schedule. Take the newest open PR that has no
            # draft, and let the required-check step decide whether it is ready.
            # Oldest-first would leave the newest PR waiting for every older one.
            # `state` is filtered here as well as in the query string. The
            # query is an API-side filter; relying on it alone means any change
            # in what the endpoint returns, or a stale listing, hands this step
            # a closed PR and the job tries to merge something that is not open.
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=50" \
              --jq '[.[] | select(.state == "open" and .draft == false)]
                    | sort_by(.number) | last | .number // empty')"
            if [[ -z "$pr" ]]; then
              echo "::notice::No mergeable pull request is open."
              exit 0
            fi
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.sha)"
            draft="false"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            # The number is in the payload. Looking it up by commit instead is a
            # second source that can disagree with the event, and when it came
            # back empty the step reported "nothing to merge" while the payload
            # had named the PR. Only `schedule` has to ask.
            pr="${PR_NUMBER:-}"
            if [[ -z "$pr" ]]; then
              echo "::error::No pull request number in the event payload."
              exit 1
            fi
            draft="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .draft)"
            if [[ "$draft" == "true" ]]; then
              echo "::notice::PR #${pr} is a draft — not merging."
              exit 0
            fi
          else
            pr="${PR_NUMBER:-}"
            if [[ -z "$pr" ]]; then
              echo "::error::No pull request number in the event payload."
              exit 1
            fi
          fi
          if [[ -z "${SHA:-}" ]]; then
            echo "::error::No commit to inspect — refusing."
            exit 1
          fi
          echo "number=${pr}" >>"$GITHUB_OUTPUT"
          echo "sha=${SHA}" >>"$GITHUB_OUTPUT"

      # Required checks are read from the branch's effective ruleset, not from a
      # list in this file. A hardcoded list is a second place that can go stale
      # — the same mistake as a metric nobody regenerates.
      #
      # `/rulesets` returns ruleset metadata with no `rules` key at all; reading
      # `.rules[]?` from it yields nothing and the `?` swallows that, so the
      # step reported an empty policy while four checks were configured. 928
      # runs, every one skipped. Branch rules live at /rules/branches/<branch>.
      - name: Read required checks from the repository ruleset
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${MEMPHIS_MAIN_BRANCH:-main}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/${branch}"
          rules="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" "$api")"

          contexts="$(jq -r '
            [ .[] | select(.type == "required_status_checks")
              | .parameters.required_status_checks[]?.context ]
            | sort | unique | join(",")' <<<"$rules")"

          if [[ -z "$contexts" ]]; then
            echo "::error::No required status checks configured for '${branch}' — refusing to auto-merge."
            exit 1
          fi
          echo "required=$contexts" >>"$GITHUB_OUTPUT"

      - name: Merge when every required check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED: ${{ steps.policy.outputs.required }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          IFS=',' read -ra contexts <<<"$REQUIRED"

          for ctx in "${contexts[@]}"; do
            # A required check with no conclusion is not a pass. "pending" and
            # "skipped" both mean the branch has not earned a merge yet.
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"${ctx}\") | .conclusion][0] // \"missing\"" 2>/dev/null || echo missing)"
            if [[ "$conclusion" != "success" ]]; then
              echo "::notice::Not merging: required check '${ctx}' is '${conclusion}'."
              exit 0
            fi
          done

          echo "All ${#contexts[@]} required checks are green — merging."
          gh pr merge "${PR_NUMBER}" --squash \
            --repo "${GITHUB_REPOSITORY}"