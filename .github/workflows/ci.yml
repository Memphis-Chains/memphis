name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Audit production dependencies (fail on high+ advisories, OTEL prometheus exporter excluded)
        # GHSA-q7rr-3cgh-j5r3 — @opentelemetry/exporter-prometheus <0.217.0 — High.
        # OTEL is opt-in (default disabled, never imported in default runtime
        # path per operator decision 2026-05-11). Fix is semver-major bump that
        # the operator deliberately is not pursuing ("nie rozbudowujemy OTEL").
        # Exclude this single advisory via jq filter; any OTHER high+ advisory
        # still fails the gate. Critical-severity ALWAYS fails regardless.
        run: |
          set -o pipefail
          audit_json=$(npm audit --omit=dev --json || true)
          # Critical = fail unconditionally (no allowlist for crit)
          critical_count=$(echo "$audit_json" | jq '.metadata.vulnerabilities.critical // 0')
          if [ "$critical_count" -gt 0 ]; then
            echo "::error::$critical_count critical vulnerabilities — fix required"
            echo "$audit_json" | jq -r '.vulnerabilities | to_entries[] | select(.value.severity == "critical") | "\(.key): \(.value.via[0].url // .value.via[0])"'
            exit 1
          fi
          # High = fail unless ALL highs are in the allowlist
          allowlist="GHSA-q7rr-3cgh-j5r3"
          unallowed=$(echo "$audit_json" | jq -r --arg al "$allowlist" '
            .vulnerabilities
            | to_entries[]
            | select(.value.severity == "high")
            | .value.via[]?
            | select(type == "object")
            | .url // empty
            | sub("https://github.com/advisories/"; "")
            | select(($al | split(" ")) | index(.) | not)
          ')
          if [ -n "$unallowed" ]; then
            echo "::error::Unallowed high advisories detected:"
            echo "$unallowed"
            exit 1
          fi
          echo "Audit passed (allowlisted: $allowlist)"

      - name: Build
        run: npm run build

      - name: Dead-code gate
        run: npm run deadcode:check

      - name: TypeScript coverage baseline
        run: npm run test:coverage

      - name: Upload TypeScript coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: error

      - name: Signed-block gate
        run: npx vitest run tests/integration/signed-block-gate.test.ts
        env:
          RUST_CHAIN_ENABLED: 'true'

      - name: Offline-invariant gate
        run: npx vitest run tests/integration/offline-invariant.test.ts
        env:
          RUST_CHAIN_ENABLED: 'true'

      - name: Chain format compatibility
        run: npx vitest run tests/integration/chain-format-compat.test.ts

      - name: Release preflight gate
        run: ./scripts/ci-release-preflight-gate.sh

  # Cross-arch matrix runs on push to main only — catches regressions that
  # only fire on arm64 or macOS hardware before someone hits them in dev.
  # Uses GitHub-hosted free runners (ubuntu-24.04-arm + macos-latest M-chip).
  #
  # 2026-05-04 (Sprint F #432): `continue-on-error` removed. Three
  # consecutive main runs landed both arms green (Sprint S1 closed the
  # last macOS-only regressions, S4 and v1.8.0 distribution kept them
  # green). Matrix is now blocking on push so a regression on either
  # arch fails the run instead of silently signalling. `fail-fast: false`
  # keeps the other arch reporting even when one breaks, so the PR
  # surface still tells you "macOS only" vs "arm64 only" at a glance.
  cross-arch:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Chain format compatibility
        run: npx vitest run tests/integration/chain-format-compat.test.ts

      - name: TypeScript test suite
        run: npm run test:ts
