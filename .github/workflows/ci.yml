name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        # Critical fails unconditionally. High fails unless every high advisory
        # is in the allowlist, with the reason recorded next to the entry in
        # scripts/dep-audit.sh.
        #
        # 2026-10-07: this was ~30 lines of inline jq duplicated from
        # nightly-crystal, which had drifted to a bare --audit-level=high with
        # no allowlist at all. Two sources of truth for one policy, and the
        # copy that ran nightly was the wrong one — it failed every night while
        # this job stayed green, carrying pii-scan.sh and secret-scan.sh inside
        # a permanently red check. Both callers now share scripts/dep-audit.sh.
        run: ./scripts/dep-audit.sh

      - name: Build
        run: npm run build

      - name: Dead-code gate
        run: npm run deadcode:check

      - name: Native tool tiers match the TypeScript registry
        # tool_tier in crates/memphis-operator/src/chat.rs is generated from
        # TOOL_REGISTRY. Five tools were one tier lower natively than in the
        # registry with nothing detecting it, so a tier-1 surface got file
        # reads the gateway refused. Regenerate, never hand-edit.
        run: npm run -s ops:sync-native-tiers -- --check

      - name: Landing page metrics match measured values
        # The metric strip, the typed terminal and the noscript fallback all
        # quote one operator instance's block and chain counts. They were
        # hand-maintained and had drifted by months (13 332 vs 15 046 blocks,
        # 57 tools vs 61, and the strip and terminal disagreeing with each
        # other). Regenerate; never hand-edit a number.
        run: npm run -s ops:sync-site-metrics -- --check

      - name: Operator PII scan
        # secret-scan.sh matches credential prefixes (ghp_, sk-ant-, AKIA,
        # PEM) and reports OK on a tree carrying an account identifier,
        # because an id matches none of those arms. That is how the real
        # Telegram chat id sat on the public default branch in ten test
        # fixtures while the scan was green. Both scans also ran only in the
        # nightly job — which is red — so a failure here would have been
        # noticed days later. Runs on every push instead.
        run: ./scripts/pii-scan.sh

      - name: Credential scan
        run: ./scripts/secret-scan.sh

      - name: Guards still catch the defects they were written for
        # Four guards were once shipped green and wrong; this is what tells
        # the two apart. Scoped to the guarded files so unrelated commits do
        # not pay for it — see .githooks/pre-commit for the same scoping.
        run: npm run -s ops:mutation-gate

      - name: TypeScript coverage baseline
        run: npm run test:coverage

      - name: Upload TypeScript coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: error

      - name: Signed-block gate
        run: npx vitest run tests/integration/signed-block-gate.test.ts
        env:
          RUST_CHAIN_ENABLED: 'true'

      - name: Offline-invariant gate
        run: npx vitest run tests/integration/offline-invariant.test.ts
        env:
          RUST_CHAIN_ENABLED: 'true'

      - name: Chain format compatibility
        run: npx vitest run tests/integration/chain-format-compat.test.ts

      - name: Release preflight gate
        run: ./scripts/ci-release-preflight-gate.sh

  # Cross-arch matrix runs on push to main only — catches regressions that
  # only fire on arm64 or macOS hardware before someone hits them in dev.
  # Uses GitHub-hosted free runners (ubuntu-24.04-arm + macos-latest M-chip).
  #
  # 2026-05-04 (Sprint F #432): `continue-on-error` removed. Three
  # consecutive main runs landed both arms green (Sprint S1 closed the
  # last macOS-only regressions, S4 and v1.8.0 distribution kept them
  # green). Matrix is now blocking on push so a regression on either
  # arch fails the run instead of silently signalling. `fail-fast: false`
  # keeps the other arch reporting even when one breaks, so the PR
  # surface still tells you "macOS only" vs "arm64 only" at a glance.
  cross-arch:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Chain format compatibility
        run: npx vitest run tests/integration/chain-format-compat.test.ts

      - name: TypeScript test suite
        run: npm run test:ts
