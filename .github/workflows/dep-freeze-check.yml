name: dep-freeze-check

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "tools/training/requirements.txt"
      - "vendor/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-new-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup jq (structural JSON diff)
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Compute new-dep list
        id: newdeps
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          # ----- npm: structural diff over dep blocks only -----
          # Only keys under dependencies / devDependencies / peerDependencies /
          # optionalDependencies / bundledDependencies count. `scripts`,
          # `version`, `engines`, `exports`, metadata etc. are NOT deps.
          new_npm=""
          if ! git diff --quiet "$base_sha" "$head_sha" -- package.json; then
            deps_before=$(git show "$base_sha:package.json" 2>/dev/null \
              | jq -r '[
                  (.dependencies // {}),
                  (.devDependencies // {}),
                  (.peerDependencies // {}),
                  (.optionalDependencies // {}),
                  (.bundledDependencies // {})
                ] | add // {} | keys[]' 2>/dev/null | sort -u || true)
            deps_after=$(jq -r '[
                  (.dependencies // {}),
                  (.devDependencies // {}),
                  (.peerDependencies // {}),
                  (.optionalDependencies // {}),
                  (.bundledDependencies // {})
                ] | add // {} | keys[]' package.json | sort -u)
            new_npm=$(comm -13 <(echo "$deps_before") <(echo "$deps_after") || true)
          fi

          # ----- Cargo: table-aware diff -----
          # Only entries inside [dependencies], [dev-dependencies],
          # [build-dependencies], [target.*.dependencies],
          # [workspace.dependencies] count. `edition`, `version`, `name`
          # under [package] are metadata, not deps.
          extract_cargo_deps() {
            local sha="$1"
            local path="$2"
            git show "$sha:$path" 2>/dev/null | awk '
              /^\[/ {
                section = $0
                sub(/^\[/, "", section); sub(/\].*$/, "", section)
                # Match any table whose name ends in "dependencies".
                in_deps = (section ~ /(^|\.)dependencies$/) ? 1 : 0
                next
              }
              in_deps && /^[[:space:]]*[A-Za-z0-9_-]+[[:space:]]*=/ {
                name = $1
                gsub(/[[:space:]]/, "", name)
                # Skip blank / table-start tokens just in case
                if (name != "" && name !~ /^\[/) print name
              }
            ' | sort -u
          }
          new_cargo=""
          cargo_manifests="Cargo.toml"
          while IFS= read -r m; do
            [ -n "$m" ] && cargo_manifests="$cargo_manifests $m"
          done < <(git ls-files 'crates/*/Cargo.toml' 2>/dev/null)
          for manifest in $cargo_manifests; do
            if git diff --quiet "$base_sha" "$head_sha" -- "$manifest" 2>/dev/null; then
              continue
            fi
            before=$(extract_cargo_deps "$base_sha" "$manifest")
            after=$(extract_cargo_deps "$head_sha" "$manifest")
            new_in_file=$(comm -13 <(echo "$before") <(echo "$after") || true)
            if [ -n "$new_in_file" ]; then
              new_cargo=$(printf '%s\n%s\n' "$new_cargo" "$new_in_file" | grep -v '^$' || true)
            fi
          done
          new_cargo=$(echo "$new_cargo" | grep -v '^$' | sort -u || true)

          # Python training requirements
          new_py=$(
            git diff "$base_sha" "$head_sha" -- tools/training/requirements.txt \
              | awk '/^\+[a-zA-Z0-9_.-]+/ && !/^\+\+\+/ {print}' \
              | sed 's/^+//' \
              | sed 's/[<>=!].*//' \
              | sort -u || true
          )

          # Vendored additions (directory names added)
          new_vendored=$(
            git diff --name-only --diff-filter=A "$base_sha" "$head_sha" -- 'vendor/**' \
              | awk -F/ 'NF>=2 {print $2}' \
              | sort -u || true
          )

          all=$(printf '%s\n%s\n%s\n%s\n' "$new_npm" "$new_cargo" "$new_py" "$new_vendored" \
                | grep -v '^$' | sort -u || true)

          if [ -z "$all" ]; then
            echo "no-new-deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-new-deps=false" >> "$GITHUB_OUTPUT"
            {
              echo "new-deps<<EOF"
              echo "$all"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR body for classification tag
        if: steps.newdeps.outputs.no-new-deps != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          NEW_DEPS: ${{ steps.newdeps.outputs.new-deps }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$PR_BODY" | grep -qE '^classification:'; then
            echo "::error::PR adds new dependencies but body has no 'classification:' section."
            echo "New deps detected:"
            printf '  - %s\n' $NEW_DEPS
            echo ""
            echo "Required: add a 'classification:' block per docs/dev/DEPENDENCY-POLICY.md."
            exit 1
          fi

          missing=""
          for dep in $NEW_DEPS; do
            # Match line like:  - <dep> = <class>
            if ! printf '%s' "$PR_BODY" | grep -qE "^[[:space:]]*-[[:space:]]*${dep}[[:space:]]*=[[:space:]]*(stdlib|stable-platform|vendored-frozen|scheduled-for-rewrite|blocked)"; then
              missing="$missing $dep"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::New deps without valid classification entry in PR body:"
            for dep in $missing; do echo "  - $dep"; done
            echo ""
            echo "Allowed classes: stdlib | stable-platform | vendored-frozen | scheduled-for-rewrite | blocked"
            exit 1
          fi

          echo "All new deps classified in PR body."

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.newdeps.outputs.no-new-deps }}" = "true" ]; then
            echo "No new deps in this PR — dep-freeze-check pass (no-op)."
          else
            echo "Classification check completed for new deps."
          fi
