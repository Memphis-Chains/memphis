name: nightly-crystal

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'

jobs:
  crystal-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      # Closure sprint Z.1.2 (2026-05-09): nightly-crystal previously
      # ran ops:nightly-crystal:json directly after `npm ci` without a
      # build step. The pass exercises the full runtime including the
      # Rust paths bridge — without `npm run build`, every probe failed
      # with "paths bridge unavailable — crates/memphis-paths NAPI
      # module did not load". Aligning with offline-acceptance.yml which
      # has had the build step since 2026-04-19.
      - name: Build
        run: npm run build

      - name: Nightly crystal pass
        run: npm run -s ops:nightly-crystal:json > nightly-crystal.json

      - name: Nightly summary
        if: always()
        run: |
          echo "## Nightly crystal pass" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .memphis-intake/nightly-quality/latest.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat .memphis-intake/nightly-quality/latest.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- missing nightly report (.memphis-intake/nightly-quality/latest.json)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-crystal-report
          if-no-files-found: warn
          path: |
            nightly-crystal.json
            .memphis-intake/nightly-quality/latest.json
