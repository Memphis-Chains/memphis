name: offline-acceptance

# Heavy end-to-end offline acceptance drill (rc-drill.sh).
# Runs full bootstrap → init → vault → embed → search → chat → TUI → HTTP → MCP
# in an isolated environment with no remote-provider keys. Optional Ollama
# checks are skipped gracefully when not reachable.
#
# Pair with `ci.yml` "Offline-invariant gate" — that one is the lightweight
# PR-time check; this one is the full acceptance pass run nightly + on demand.

on:
  workflow_dispatch:
  # Closure sprint Z.1.2 (2026-05-09): scheduled run disabled. The drill
  # invokes `rc-drill.sh` which expects the embedding fallback path to
  # return seeded memory via `embed search`; on the GitHub runner without
  # Ollama (and without a service container spawning it) the fallback
  # returns no hits, so line 442 of rc-drill.sh throws
  # "rc-drill: semantic recall did not return the seeded memory". Real
  # fix tracked in #553 — either spawn an Ollama service container or
  # gate the semantic-recall assertion behind `MEMPHIS_HAS_OLLAMA=1`.
  # Operator can still trigger this workflow manually via
  # `gh workflow run offline-acceptance` to validate locally before any
  # release.

jobs:
  fresh-env-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run rc-drill in fresh isolated environment
        run: npm run ops:offline-acceptance:fresh-env
