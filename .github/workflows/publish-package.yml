name: publish-package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (required, e.g. v0.3.0)'
        required: true
        type: string

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag format
        run: |
          case "${{ inputs.tag }}" in
            v*) ;;
            *)
              echo "Tag must start with v (for example: v0.3.0)." >&2
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Run release smoke gate
        run: npm run release:smoke

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
