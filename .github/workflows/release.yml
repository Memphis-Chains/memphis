name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run shared release gates
        run: bash ./scripts/run-release-gates.sh

  package-tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # S9-0: `npm pack` triggers `prepack` (package.json scripts) which
      # runs `npm run build:release` → release-mode rebuild of the NAPI
      # bridge into crates/memphis-napi/index.node, then tsc. The
      # gitignored bridge (`.gitignore:44`, anti-bloat policy) is rebuilt
      # fresh into the tarball every release. Codex P1 round 1 caught the
      # earlier mistake of building release first then letting prepack's
      # debug build clobber it.
      - name: Pack npm tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ./*.tgz

  release:
    needs: package-tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Ensure changelog section exists
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "## ${TAG}" CHANGELOG.md; then
            DATE=$(date +%F)
            TMP=$(mktemp)
            {
              echo "## ${TAG} - ${DATE}"
              echo ""
              echo "- Automated release from CI."
              echo ""
              cat CHANGELOG.md
            } > "$TMP"
            mv "$TMP" CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.tgz

  publish-npm-github-packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run shared release gates
        run: bash ./scripts/run-release-gates.sh

      - name: Publish to GitHub Packages
        run: |
          npm publish 2>&1 | tee /tmp/npm-publish.log || {
            if grep -q "Cannot publish over existing version" /tmp/npm-publish.log; then
              echo "Version already published — skipping (idempotent)"
              exit 0
            fi
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
