name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run shared release gates
        run: bash ./scripts/run-release-gates.sh

  package-tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # S9-0: `npm pack` triggers `prepack` (package.json scripts) which
      # runs `npm run build:release` → release-mode rebuild of the NAPI
      # bridge into crates/memphis-napi/index.node, then tsc. The
      # gitignored bridge (`.gitignore:44`, anti-bloat policy) is rebuilt
      # fresh into the tarball every release. Codex P1 round 1 caught the
      # earlier mistake of building release first then letting prepack's
      # debug build clobber it.
      - name: Pack npm tarball
        run: npm pack

      # S8-1: SHA256SUMS for operator-side checksum verification.
      # Always emitted regardless of GPG availability — the tarball
      # checksum is independently useful even when signing is off.
      - name: Generate SHA256SUMS
        run: |
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS

      # S8-1: optional GPG-detached signatures (.asc). Gracefully
      # degrades when secrets aren't configured — operator can publish
      # the keypair to repo secrets later and the next tag auto-signs.
      # Doc: docs/dev/RELEASE-PROCESS.md.
      - name: Check GPG availability
        id: gpg-check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice ::GPG signing enabled — release artifacts will ship with detached .asc signatures."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::GPG_PRIVATE_KEY secret not set — release artifacts will be unsigned. See docs/dev/RELEASE-PROCESS.md to enable signing."
          fi

      - name: Import GPG key
        if: steps.gpg-check.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Sign tarball + SHA256SUMS
        if: steps.gpg-check.outputs.available == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for f in *.tgz SHA256SUMS; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --armor "$f"
          done
          ls -la *.asc

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            ./*.tgz
            ./SHA256SUMS
            ./*.asc
          if-no-files-found: warn

  release:
    needs: package-tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Ensure changelog section exists
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "## ${TAG}" CHANGELOG.md; then
            DATE=$(date +%F)
            TMP=$(mktemp)
            {
              echo "## ${TAG} - ${DATE}"
              echo ""
              echo "- Automated release from CI."
              echo ""
              cat CHANGELOG.md
            } > "$TMP"
            mv "$TMP" CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.tgz
            release-assets/**/SHA256SUMS
            release-assets/**/*.asc

  publish-npm-github-packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run shared release gates
        run: bash ./scripts/run-release-gates.sh

      - name: Publish to GitHub Packages
        run: |
          npm publish 2>&1 | tee /tmp/npm-publish.log || {
            if grep -q "Cannot publish over existing version" /tmp/npm-publish.log; then
              echo "Version already published — skipping (idempotent)"
              exit 0
            fi
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
