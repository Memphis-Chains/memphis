name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run shared release gates
        run: bash ./scripts/run-release-gates.sh

  package-tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Pack npm tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ./*.tgz

  release:
    needs: package-tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Ensure changelog section exists
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "## ${TAG}" CHANGELOG.md; then
            DATE=$(date +%F)
            TMP=$(mktemp)
            {
              echo "## ${TAG} - ${DATE}"
              echo ""
              echo "- Automated release from CI."
              echo ""
              cat CHANGELOG.md
            } > "$TMP"
            mv "$TMP" CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.tgz

  publish-npm-github-packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run shared release gates
        run: bash ./scripts/run-release-gates.sh

      - name: Publish to GitHub Packages
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name" | sed 's|@||g' | sed 's|/|%2F|g')
          echo "Package: ${PKG_NAME}@${PKG_VERSION}"
          
          # Check if version already exists in GitHub Packages
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            "https://npm.pkg.github.com/${PKG_NAME}/${PKG_VERSION}")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Version ${PKG_VERSION} already exists - skipping publish (idempotent)"
            exit 0
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "Version ${PKG_VERSION} not found in registry - publishing..."
            npm publish
          else
            echo "Unexpected registry response: ${HTTP_CODE}"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
