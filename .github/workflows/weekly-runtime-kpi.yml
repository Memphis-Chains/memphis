name: weekly-runtime-kpi

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1' # Monday 03:30 UTC

# Grant the workflow's auto-provided GITHUB_TOKEN enough scope to create
# and comment on issues. The default token for scheduled workflows is
# read-only on issues/comments; without this block, 'issues.create' and
# 'issues.createComment' fail with 403 "Resource not accessible by
# integration" when only GITHUB_TOKEN is in play (last seen on run
# 35581859870 — 2026-09-21 09:11 UTC). Kept as defence-in-depth: even
# with the custom PAT below, falling back to GITHUB_TOKEN on a secret-
# rotation failure yields a clear 'permission denied' rather than a
# silent scope downgrade.
permissions:
  issues: write

jobs:
  weekly-kpi:
    runs-on: ubuntu-latest
    steps:
      - name: Compute and publish weekly KPI
        uses: actions/github-script@v7
        with:
          # Use a dedicated PAT (MEMPHIS_BOT_TOKEN) instead of the
          # auto-provided GITHUB_TOKEN. The default integration token
          # for scheduled workflows in this org returns "Resource not
          # accessible by integration" on issues.* calls even with
          # permissions: issues: write accepted (response header
          # x-accepted-github-permissions: issues=write — confirmed
          # via run 35607257998, 2026-09-21 13:41 UTC). The repo-level
          # PAT bypasses the integration-app restriction.
          #
          # Set with: gh secret set MEMPHIS_BOT_TOKEN < ~/.memphis/.github-pat
          # Rotation: aligned with the operator's local PAT rotation
          # cadence (see scripts/set-github-pat.mjs).
          github-token: ${{ secrets.MEMPHIS_BOT_TOKEN }}
          script: |
            const title = '📊 Weekly Ollama Runtime KPI';
            const now = new Date();
            const since = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

            const { data: closedIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100,
              since
            });

            const incidents = closedIssues.filter((i) => !i.pull_request && i.title === '🚨 Nightly Ollama runtime smoke failed');
            const mttrMinutes = incidents
              .map((i) => (new Date(i.closed_at) - new Date(i.created_at)) / 60000)
              .filter((v) => Number.isFinite(v));
            const avgMttr = mttrMinutes.length ? (mttrMinutes.reduce((a, b) => a + b, 0) / mttrMinutes.length).toFixed(1) : 'n/a';

            const body = [
              `Week ending: ${now.toISOString().slice(0,10)}`,
              '',
              `Closed incidents: ${incidents.length}`,
              `Average MTTR (minutes): ${avgMttr}`,
              '',
              `Source window: since ${since}`
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find((i) => !i.pull_request && i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
