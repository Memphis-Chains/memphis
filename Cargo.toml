[workspace]
# The pure Rust crates live under crates/ and build with a plain
# `cargo build --workspace` — no system GUI dependencies.
#
# apps/ holds executable targets that need their own dependency setup
# (Tauri, CLI bundles, ad-hoc tooling). They are excluded from this
# workspace on purpose: Tauri pulls in glib-sys, which fails to build on
# the CI runners, and adding it here broke `cargo build --workspace` for
# every pure-Rust crate (quality-gate, nightly-crystal, cross-arch).
# Measured on the operator host 2026-10-26: webkit2gtk-4.1 2.54.1,
# javascriptcoregtk-4.1 2.54.1, libsoup-3.0 3.8.0, gtk+-3.0 3.24.52,
# ayatana-appindicator3-0.1 0.6.1 are ALL present there — the missing
# dependency diagnosis in ADR-010 came from Debian package names applied
# to an Arch host. See ADR-011 for the rebuild plan.
members = [
  "crates/*",
]
exclude = [
  # apps/memphis-chain-draft is the operator-local Phase 1 chain MVP
  # workspace. Excluded so `cargo check --workspace` from the host
  # repo doesn't pick it up. After passphrase-gate commit + ADR-010
  # adoption, this exclusion is removed.
  "apps/memphis-chain-draft",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zeroize = "1"
