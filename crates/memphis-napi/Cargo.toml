[package]
name = "memphis-napi"
version = "0.1.0"
edition = "2021"

[lib]
# "rlib" as well as "cdylib": the bridge's export contract is checked by an
# integration test (`tests/bridge_export_contract.rs`), and an integration
# test needs to LINK the crate. The shipped artefact is still the cdylib —
# `scripts/run-rust.sh` copies `libmemphis_napi.so`.
crate-type = ["cdylib", "rlib"]

[dependencies]
memphis-core = { path = "../memphis-core" }
memphis-vault = { path = "../memphis-vault" }
memphis-embed = { path = "../memphis-embed" }
memphis-case-index = { path = "../memphis-case-index" }
memphis-paths = { path = "../memphis-paths" }
memphis-export = { path = "../memphis-export" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
napi = { version = "3", features = ["napi9", "serde-json"] }
napi-derive = "3"
hex = "0.4"
