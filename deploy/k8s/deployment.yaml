apiVersion: apps/v1
kind: Deployment
metadata:
  name: memphis
  labels:
    app: memphis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memphis
  template:
    metadata:
      labels:
        app: memphis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: memphis
          image: ghcr.io/memphis-chains/memphis:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: memphis-config
            - secretRef:
                name: memphis-secrets
          env:
            - name: MEMPHIS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: memphis-secrets
                  key: MEMPHIS_API_TOKEN
            - name: OLLAMA_URL
              value: 'http://localhost:11434'
          volumeMounts:
            - name: memphis-data
              mountPath: /home/memphis/.memphis
            - name: app-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
        - name: public-chat
          image: ghcr.io/memphis-chains/memphis:latest
          command: ['node', '--permission', '--allow-fs-read=/app/scripts/public-chat-gateway.mjs', '--allow-fs-read=/app/sites/memphis-v5', '/app/scripts/public-chat-gateway.mjs']
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          env:
            - name: PUBLIC_CHAT_HOST
              value: '0.0.0.0'
          ports:
            - containerPort: 9100
              name: public-chat
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
          env:
            - name: HOME
              value: /home/ollama
          ports:
            - containerPort: 11434
              name: ollama
          volumeMounts:
            - name: ollama-data
              mountPath: /home/ollama
      volumes:
        - name: memphis-data
          persistentVolumeClaim:
            claimName: memphis-data-pvc
        - name: app-data
          emptyDir: {}
        - name: ollama-data
          persistentVolumeClaim:
            claimName: memphis-models-pvc
