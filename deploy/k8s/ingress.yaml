apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memphis
  labels:
    app: memphis
spec:
  # Install a controller with the vendor's security fixes before applying this example.
  ingressClassName: nginx
  tls:
    - hosts: [memphis.example.com]
      secretName: memphis-public-tls
  rules:
    - host: memphis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memphis-public
                port:
                  number: 80
