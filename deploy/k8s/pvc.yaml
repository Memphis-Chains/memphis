apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memphis-data-pvc
  labels:
    app: memphis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memphis-models-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 12Gi
