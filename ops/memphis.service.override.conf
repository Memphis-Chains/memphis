# Place in /etc/systemd/system/memphis.service.d/override.conf
# Then run: systemctl daemon-reload && systemctl restart memphis
#
# Sizing guide — adjust CPUQuota and MemoryMax to your hardware:
#
#   Hardware              CPUQuota   MemoryMax
#   ─────────────────────────────────────────────
#   1 core  /  2 GB RAM   100%       1G    (default)
#   2 core  /  4 GB RAM   200%       2G
#   4 core  /  8 GB RAM   400%       4G
#   8 core  / 16 GB RAM   800%       8G
#
# Formula:
#   CPUQuota = number_of_cores × 100%
#   MemoryMax ≈ 50% of system RAM
#
# Uncomment and adjust as needed:

# [Service]
# MemoryMax=2G
# CPUQuota=200%
# Environment=LOG_LEVEL=debug
# Environment=RUST_CHAIN_ENABLED=true
# Environment=MEMPHIS_CHANNEL_GATEWAY_ENABLED=true
# Environment=MEMPHIS_REFLECTION_ENABLED=false
