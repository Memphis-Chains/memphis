[Service]
# The native bridge is installed from the release build, not from the
# in-tree `crates/memphis-napi/index.node`.
#
# The in-tree artifact is a debug build (58 MB, unstripped) while this
# path gets the release build (7 MB). Two different Rust binaries were
# reachable on one host: the service ran the release one, and every CLI
# invocation outside systemd ran the debug one. `memphis vault list` and
# the runtime could therefore disagree about what the vault contained.
#
# The release `.so` is what the service loads. `npm run build:rust:release`
# refreshes it, and `ops:check-native-bridge` fails when the Rust source
# is newer than the binary — a stale bridge used to be silent.
RuntimeDirectory=memphis-native
RuntimeDirectoryMode=0700
ExecStartPre=/usr/bin/install -m 0500 %h/memphis/target/release/libmemphis_napi.so %t/memphis-native/index.node
ExecStart=
ExecStart=/usr/bin/env NODE_ENV=production MEMPHIS_STRICT_PRODUCTION_SAFETY=1 RUST_CHAIN_BRIDGE_PATH=%t/memphis-native/index.node /usr/bin/node %h/memphis/dist/infra/cli/index.js serve
