[Service]
# The native bridge is installed from the release build, not from the
# in-tree `crates/memphis-napi/index.node`.
#
# The in-tree artifact is a debug build (58 MB, unstripped) while this
# path gets the release build (7 MB). Two different Rust binaries were
# reachable on one host: the service ran the release one, and every CLI
# invocation outside systemd ran the debug one. `memphis vault list` and
# the runtime could therefore disagree about what the vault contained.
#
# The release `.so` is what the service loads. `npm run build:rust:release`
# refreshes it, and `ops:check-native-bridge` fails when the Rust source
# is newer than the binary — a stale bridge used to be silent.
RuntimeDirectory=memphis-native
RuntimeDirectoryMode=0700
ExecStartPre=/usr/bin/install -m 0500 %h/memphis/target/release/libmemphis_napi.so %t/memphis-native/index.node
ExecStart=
ExecStart=/usr/bin/env NODE_ENV=production MEMPHIS_STRICT_PRODUCTION_SAFETY=1 RUST_CHAIN_BRIDGE_PATH=%t/memphis-native/index.node /usr/bin/node %h/memphis/dist/infra/cli/index.js serve

# Chain rotation — the chains grew without bound.
#
# Measured on this host (2026-11-22): the `system` chain held 15 748
# blocks and 62 MB, and 180 of the last 200 blocks were
# `system_event/scheduler_task` — operational noise, not history. The
# `insights` chain held 33 MB across 402 blocks because every generated
# insight embedded full copies of its source blocks. Nothing bounded
# either chain: rotation existed and was not enabled, and it could not be
# enabled, because rotating a chain produced a chain every validator
# rejected as "missing genesis block".
#
# Both of those are fixed: the rotation head marker proves that the live
# chain continues an archive, and the publish step runs under the same
# write lock the append path takes, so no reader can observe the chain
# mid-rotation.
#
# The interval is how often the loop LOOKS; the threshold is what
# actually triggers a rotation. A chain that stays under 10 MB is never
# touched, so this costs one directory listing per hour.
Environment=MEMPHIS_CHAIN_ROTATE_INTERVAL_MS=3600000
Environment=MEMPHIS_CHAIN_ROTATION_THRESHOLD_BYTES=10485760
# 500 blocks stay live after a rotation — roughly two days of scheduler
# events, so the recent operational context survives in place while the
# older prefix is archived (and restorable) instead of deleted.
Environment=MEMPHIS_CHAIN_ROTATION_MIN_KEEP_BLOCKS=500
# Archive GC: four archives per chain are kept. An archive is the only
# path back from a rotation the operator did not want, so they are kept
# — but not forever.
Environment=MEMPHIS_CHAIN_GC_ENABLED=true
Environment=MEMPHIS_CHAIN_GC_KEEP_ARCHIVES=4
