<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>404 — nie ma takiej strony | marcin-kukla.pl</title>
<meta name="description" content="Ta strona nie istnieje. Wróć na stronę główną albo napisz bezpośrednio." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;600&display=swap" />
<style>
:root{--bg:#040509;--fg:#e8e6e1;--dim:#8a96a6;--orange:#ff6b35;--orange-soft:#ff8c5e;--line:rgba(255,255,255,.10);--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.65;padding:2rem;background-image:radial-gradient(ellipse 70% 50% at 20% 0%,rgba(255,107,53,.10),transparent),radial-gradient(ellipse 70% 50% at 80% 100%,rgba(45,212,191,.06),transparent)}
main{width:min(760px,100%);text-align:center}
.code{font-family:var(--mono);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);margin-bottom:1rem}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,3.4rem);line-height:1.08;letter-spacing:-.03em;margin-bottom:1rem}
h1 em{font-style:italic;color:var(--orange-soft)}
p{color:var(--dim);max-width:52ch;margin:0 auto 2rem;font-size:1.05rem}
nav{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;padding:.8rem 1.4rem;border-radius:999px;text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid transparent}
.primary{background:var(--orange);color:#fff;box-shadow:0 10px 30px -12px rgba(255,107,53,.6)}
.primary:hover{background:var(--orange-soft)}
.ghost{color:var(--fg);border-color:var(--line)}
.ghost:hover{background:rgba(255,255,255,.05)}
footer{margin-top:2.5rem;font-family:var(--mono);font-size:.75rem;color:var(--dim);letter-spacing:.08em}
</style>
</head>
<body>
<main>
  <div class="code">Błąd 404</div>
  <h1>Tej strony <em>tu nie ma</em></h1>
  <p>Adres mógł się zmienić albo zawierał literówkę. Wróć na stronę główną, zajrzyj do projektów — albo po prostu napisz.</p>
  <nav>
    <a class="primary" href="/">Strona główna</a>
    <a class="ghost" href="/projekty/">Projekty</a>
    <a class="ghost" href="/kontakt/">Kontakt</a>
  </nav>
  <footer>marcin-kukla.pl</footer>
</main>
</body>
</html>
