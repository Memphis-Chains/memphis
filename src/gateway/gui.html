<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memphis Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117; color: #c9d1d9;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 16px 24px; background: #161b22; border-bottom: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; color: #58a6ff; }
    header .status { font-size: 12px; color: #3fb950; }
    #chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .message {
      max-width: 70%; padding: 12px 16px; border-radius: 12px;
      line-height: 1.5; white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end; background: #238636; color: white;
    }
    .message.assistant {
      align-self: flex-start; background: #21262d; border: 1px solid #30363d;
    }
    .message.error { background: #da3633; color: white; }
    .message.system { background: #1f6feb22; border: 1px solid #1f6feb; font-size: 13px; }
    #input-area {
      padding: 16px; background: #161b22; border-top: 1px solid #30363d;
      display: flex; gap: 12px;
    }
    #input {
      flex: 1; padding: 12px 16px; border-radius: 8px;
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      font-size: 15px; resize: none; outline: none;
    }
    #input:focus { border-color: #58a6ff; }
    #send {
      padding: 12px 24px; border-radius: 8px; border: none;
      background: #238636; color: white; font-size: 15px; cursor: pointer;
    }
    #send:hover { background: #2ea043; }
    #send:disabled { background: #30363d; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>🧠 Memphis Chat</h1>
    <span class="status">● Online</span>
  </header>
  <div id="chat"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Napisz wiadomość..."></textarea>
    <button id="send">Wyślij</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMessage(text, type = 'assistant') {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      
      addMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/provider/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
        });
        const data = await res.json();
        addMessage(data.response || JSON.stringify(data, null, 2));
      } catch (err) {
        addMessage('Błąd: ' + err.message, 'error');
      }
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    addMessage('Połączono z Memphis! Jestem gotowy.', 'system');
  </script>
</body>
</html>
